name: Build OmniFetch Executable

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Ensure app.ico exists
        run: |
          python -c "
          from PIL import Image, ImageDraw
          import os
          if not os.path.exists('app.ico'):
              img = Image.new('RGBA', (64, 64), color=(0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              draw.rounded_rectangle([4, 4, 60, 60], radius=12, fill='#89b4fa')
              draw.polygon([(32, 44), (20, 26), (27, 26), (27, 14), (37, 14), (37, 26), (44, 26)], fill='#11111b')
              img.save('app.ico', format='ICO', sizes=[(16, 16), (32, 32), (48, 48), (64, 64)])
          "

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller OmniFetch.spec

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniFetch-Windows
          path: dist/OmniFetch.exe

      - name: Create Release and Upload Asset
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'OmniFetch Pro v1.0.0' }}
          files: dist/OmniFetch.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
