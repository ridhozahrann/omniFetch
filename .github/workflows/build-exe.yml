name: Build OmniFetch Executable

on:
  push:
    branches:
      - master
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow pycryptodomex mutagen certifi websockets requests

      - name: Ensure crisp app.ico and app.png exist
        run: |
          python -c "
          from PIL import Image, ImageDraw
          import os
          size = 1024
          img = Image.new('RGBA', (size, size), (0, 0, 0, 0))
          draw = ImageDraw.Draw(img)
          bg_color = (137, 180, 250, 255)
          fg_color = (17, 17, 27, 255)
          draw.rounded_rectangle([48, 48, size - 48, size - 48], radius=200, fill=bg_color)
          x_center = size // 2
          draw.rectangle([x_center - 64, 220, x_center + 64, 560], fill=fg_color)
          draw.polygon([(x_center, 720), (220, 520), (size - 220, 520)], fill=fg_color)
          draw.rounded_rectangle([240, 740, size - 240, 820], radius=30, fill=fg_color)
          icon_256 = img.resize((256, 256), Image.Resampling.LANCZOS)
          icon_256.save('app.png', format='PNG')
          sizes = [(16, 16), (24, 24), (32, 32), (48, 48), (64, 64), (128, 128), (256, 256)]
          icon_256.save('app.ico', format='ICO', sizes=sizes)
          "

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller OmniFetch.spec

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: OmniFetch-Windows
          path: dist/OmniFetch.exe

      - name: Create Release and Upload Asset
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'OmniFetch Pro v1.0.0' }}
          files: dist/OmniFetch.exe
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
